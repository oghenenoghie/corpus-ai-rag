[project]
name = "corpus-api"
version = "0.1.0"
description = "Corpus retrieval + ingestion API (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.4",
    "pydantic-settings>=2.7.0",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.6",
    "anthropic>=0.42.0",
    "openai>=1.58.1",
    "sentence-transformers>=3.3.1",
    "pymupdf>=1.25.1",
    "python-multipart>=0.0.20",
    "tiktoken>=0.8.0",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
cohere-rerank = ["cohere>=5.13.3"]
dev = [
    "ruff>=0.8.4",
    "mypy>=1.14.0",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
